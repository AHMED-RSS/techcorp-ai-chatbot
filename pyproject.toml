[project]
name = "chatbot-app"
version = "1.0.0"
description = "Local agentic AI workspace powered by Streamlit, Ollama and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "ollama",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "orjson",
    "pypdf",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pandas",
    "pillow",
    "chromadb",
    "ddgs",
    "pytest",
    "pytesseract>=0.3.13",
    "pymupdf>=1.28.0",
    "authlib>=1.3.2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
techcorp-doctor = "scripts.doctor:main"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
package = false
